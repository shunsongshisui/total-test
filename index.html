<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人格测试 · 合集</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0a0a12;
    color: #e8e0d0;
    min-height: 100vh;
    display: flex; justify-content: center; align-items: center;
    background-image:
        radial-gradient(ellipse at 20% 30%, rgba(201,149,60,0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(45,212,191,0.03) 0%, transparent 50%);
}
.container { max-width: 720px; width: 100%; padding: 40px 20px; }

/* Header */
.header { text-align: center; margin-bottom: 40px; }
.header .icon { font-size: 42px; display: block; margin-bottom: 8px; }
.header h1 {
    font-size: 36px; font-weight: 900; letter-spacing: 4px;
    background: linear-gradient(180deg, #e8e0d0, #c9953c);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
}
.header .sub { font-size: 13px; color: #7a64a0; letter-spacing: 3px; margin-top: 4px; }

/* Section */
.section { margin-bottom: 32px; }
.section-title {
    font-size: 12px; letter-spacing: 3px; color: #7a64a0;
    margin-bottom: 12px; padding-left: 4px;
}

/* Cards */
.card-grid { display: flex; flex-direction: column; gap: 10px; }
.card {
    display: flex; align-items: center; gap: 16px;
    padding: 18px 20px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    text-decoration: none; color: #e8e0d0;
    transition: all 0.25s; cursor: pointer;
}
.card:hover {
    background: rgba(255,255,255,0.04);
    border-color: rgba(201,149,60,0.3);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}
.card:active { transform: scale(0.98); }

.card-icon { font-size: 32px; flex-shrink: 0; width: 48px; text-align: center; }
.card-body { flex: 1; min-width: 0; }
.card-name {
    font-size: 17px; font-weight: 700; letter-spacing: 2px;
    margin-bottom: 2px;
}
.card-desc {
    font-size: 12px; color: rgba(232,220,200,0.5); line-height: 1.4;
    letter-spacing: 0.5px;
}
.card-arrow { font-size: 18px; color: rgba(232,220,200,0.2); flex-shrink: 0; }
.card:hover .card-arrow { color: #c9953c; }

/* Sub-card row */
.sub-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.sub-card {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border-radius: 8px;
    background: rgba(255,255,255,0.01);
    border: 1px solid rgba(255,255,255,0.04);
    text-decoration: none; color: #e8e0d0;
    transition: all 0.2s; cursor: pointer;
}
.sub-card:hover {
    background: rgba(255,255,255,0.03);
    border-color: rgba(201,149,60,0.2);
}
.sub-card .sc-icon { font-size: 20px; }
.sub-card .sc-name { font-size: 12px; letter-spacing: 1px; }

/* Group card - special */
.card-group { padding: 20px; }
.card-group .card-body { display: flex; flex-direction: column; gap: 4px; }

/* Footer */
.footer {
    text-align: center; margin-top: 40px; padding-top: 24px;
    border-top: 1px solid rgba(255,255,255,0.04);
}
.footer .fb-link {
    font-size: 12px; color: rgba(232,220,200,0.3); letter-spacing: 1px;
    cursor: pointer; transition: color 0.2s; text-decoration: none;
}
.footer .fb-link:hover { color: rgba(232,220,200,0.6); }
.footer .credit {
    font-size: 11px; color: rgba(255,255,255,0.06);
    letter-spacing: 2px; margin-top: 8px;
}

@media (max-width: 480px) {
    .container { padding: 24px 16px; }
    .header h1 { font-size: 28px; }
    .sub-row { grid-template-columns: 1fr; }
    .card { padding: 14px 16px; }
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <span class="icon">🎭</span>
        <h1>人格测试·合集</h1>
        <div class="sub">✦ 找到你灵魂的样子 ✦</div>
    </div>

    <!-- 诡秘之主系列 -->
    <div class="section">
        <div class="section-title">▎诡秘之主系列</div>
        <div class="card-grid">
            <a class="card card-group" href="amti-index.html">
                <div class="card-icon">🧐</div>
                <div class="card-body">
                    <div class="card-name">AMTI · 阿蒙人格测试</div>
                    <div class="card-desc">诡秘之主中阿蒙的十八种面相——你是本体蒙、有趣蒙、还是滴滴打蒙？</div>
                    <div class="sub-row">
                        <a class="sub-card" href="amti-index.html">
                            <span class="sc-icon">🧐</span>
                            <span class="sc-name">答题版</span>
                        </a>
                        <a class="sub-card" href="amti-fate.html">
                            <span class="sc-icon">🎲</span>
                            <span class="sc-name">天命版</span>
                        </a>
                    </div>
                </div>
                <span class="card-arrow">→</span>
            </a>

            <a class="card card-group" href="lom-main.html">
                <div class="card-icon">🃏</div>
                <div class="card-body">
                    <div class="card-name">LOM · 诡秘之主谱系测试</div>
                    <div class="card-desc">二十二条途径通向二十二种命运——你体内流淌着哪一位祂的血？</div>
                    <div class="sub-row">
                        <a class="sub-card" href="lom-main.html">
                            <span class="sc-icon">🃏</span>
                            <span class="sc-name">答题版</span>
                        </a>
                        <a class="sub-card" href="lom-fate.html">
                            <span class="sc-icon">🔮</span>
                            <span class="sc-name">天命版</span>
                        </a>
                    </div>
                </div>
                <span class="card-arrow">→</span>
            </a>
        </div>
    </div>

    <!-- 八仙系列 -->
    <div class="section">
        <div class="section-title">▎八仙系列</div>
        <div class="card-grid">
            <a class="card" href="baxian-test/index.html">
                <div class="card-icon">🍶</div>
                <div class="card-body">
                    <div class="card-name">八仙人格测试</div>
                    <div class="card-desc">你是冷面谋士吕洞宾、战力天花板何仙姑、还是贵气憨憨曹国舅？</div>
                </div>
                <span class="card-arrow">→</span>
            </a>
            <a class="card" href="baxian-test/fate.html">
                <div class="card-icon">☯</div>
                <div class="card-body">
                    <div class="card-name">八仙 · 天命版</div>
                    <div class="card-desc">全凭天意——让命运替你决定你是谁</div>
                </div>
                <span class="card-arrow">→</span>
            </a>
        </div>
    </div>

    <div class="footer">
        <a class="fb-link" href="amti-index.html" style="margin-right:16px;">🧐 直接开始测试</a>
        <span class="fb-link">献给诡秘之主 · Memories老师</span>
        <div class="credit">👁 人格测试合集 · 2026</div>
    </div>
</div>
</body>
</html>
