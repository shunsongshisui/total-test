<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《八仙！》人格测试 · 全面版</title>
<style>
  /* 字体使用系统默认，确保国内可无阻碍访问 */

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0f0b18;
    color: #e8e0d0;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 烟火气背景 */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(218,140,92,0.04), transparent 50%),
      radial-gradient(ellipse at 80% 70%, rgba(246,211,101,0.03), transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(138,76,90,0.02), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 30px 20px 80px;
    position: relative;
    z-index: 1;
  }

  /* ===== 头部 ===== */
  .hero {
    text-align: center;
    padding: 30px 0 24px;
  }
  .hero .movie-badge {
    display: inline-block;
    background: rgba(218,140,92,0.12);
    border: 1px solid rgba(218,140,92,0.2);
    border-radius: 6px;
    padding: 2px 10px;
    font-size: 0.6em;
    color: #da8c5c;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }
  .hero h1 {
    font-family: 'PingFang SC', 'Microsoft YaHei', cursive;
    font-size: 3em;
    background: linear-gradient(135deg, #f6d365, #da8c5c, #e8b87a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 6px;
    line-height: 1.2;
  }
  .hero h1 .exclaim { -webkit-text-fill-color: #da8c5c; }
  .hero p {
    color: #a09080;
    margin-top: 6px;
    font-size: 0.9em;
    letter-spacing: 2px;
  }
  .hero .subtitle {
    display: inline-block;
    background: rgba(255,215,150,0.06);
    border: 1px solid rgba(255,215,150,0.1);
    border-radius: 20px;
    padding: 3px 16px;
    font-size: 0.7em;
    color: #c0a890;
    margin-top: 6px;
  }

  /* ===== 进度 ===== */
  .progress-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }
  .progress-track {
    flex: 1;
    height: 4px;
    background: #2a2a3a;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #da8c5c, #f6d365);
    border-radius: 2px;
    transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .progress-text {
    font-size: 0.78em;
    color: #a09080;
    min-width: 45px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* ===== 题目卡片 ===== */
  .question-card {
    background: linear-gradient(160deg, rgba(28,22,38,0.96), rgba(18,16,32,0.98));
    border: 1px solid rgba(255,215,150,0.08);
    border-radius: 18px;
    padding: 36px 32px;
    display: none;
  }
  .question-card.active { display: block; animation: fadeIn 0.45s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .q-number {
    font-size: 0.7em;
    color: #da8c5c;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }
  .q-tag {
    display: inline-block;
    font-size: 0.6em;
    padding: 2px 10px;
    border-radius: 10px;
    background: rgba(246,211,101,0.06);
    border: 1px solid rgba(246,211,101,0.1);
    color: #c8b898;
    margin-bottom: 10px;
  }
  .q-title {
    font-size: 1.2em;
    font-weight: 700;
    color: #f0e8d8;
    line-height: 1.6;
    margin-bottom: 22px;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }

  .option-btn {
    display: block;
    width: 100%;
    padding: 14px 20px;
    background: rgba(255,215,150,0.04);
    border: 1px solid rgba(255,215,150,0.1);
    border-radius: 12px;
    color: #d0c8b8;
    font-size: 0.93em;
    cursor: pointer;
    transition: all 0.25s ease;
    text-align: left;
    font-family: inherit;
    line-height: 1.5;
  }
  .option-btn:hover {
    background: rgba(255,215,150,0.1);
    border-color: rgba(246,211,101,0.3);
    transform: translateX(4px);
    color: #f0e8d8;
  }
  .option-btn:active { transform: translateX(2px) scale(0.99); }
  .option-btn.selected {
    background: rgba(246,211,101,0.12);
    border-color: rgba(246,211,101,0.35);
    color: #f6d365;
  }

  /* ===== 导航按钮 ===== */
  .q-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    gap: 10px;
  }
  .back-btn {
    padding: 10px 20px;
    background: rgba(255,215,150,0.05);
    border: 1px solid rgba(255,215,150,0.12);
    border-radius: 10px;
    color: #a09080;
    font-size: 0.82em;
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
  }
  .back-btn:hover {
    background: rgba(255,215,150,0.1);
    border-color: rgba(255,215,150,0.25);
    color: #d0c0a0;
  }
  .back-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
  .q-counter {
    font-size: 0.72em;
    color: #605040;
    letter-spacing: 1px;
  }

  /* ===== 星座 & MBTI 徽章 ===== */
  .profile-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 14px 0 4px;
  }
  .profile-badges span {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 12px;
    border-radius: 14px;
    font-size: 0.75em;
  }
  .badge-zodiac {
    background: rgba(160,128,192,0.1);
    border: 1px solid rgba(160,128,192,0.15);
    color: #c0a8d0;
  }
  .badge-mbti {
    background: rgba(246,211,101,0.07);
    border: 1px solid rgba(246,211,101,0.12);
    color: #e8c87a;
  }

  /* ===== 意见箱 ===== */
  .feedback-section {
    margin-top: 44px;
    padding: 28px 24px;
    background: rgba(255,215,150,0.02);
    border: 1px solid rgba(255,215,150,0.06);
    border-radius: 16px;
    text-align: center;
    display: none;
  }
  .feedback-section.active { display: block; }
  .feedback-section h3 {
    font-size: 0.85em;
    color: #a09080;
    letter-spacing: 3px;
    margin-bottom: 4px;
  }
  .feedback-section p {
    font-size: 0.75em;
    color: #706050;
    margin-bottom: 14px;
  }
  .feedback-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 460px;
    margin: 0 auto;
  }
  .feedback-form textarea {
    width: 100%;
    padding: 14px 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,215,150,0.1);
    border-radius: 10px;
    color: #d0c8b8;
    font-size: 0.85em;
    font-family: inherit;
    resize: vertical;
    min-height: 80px;
    outline: none;
    transition: border-color 0.2s;
  }
  .feedback-form textarea:focus {
    border-color: rgba(246,211,101,0.25);
  }
  .feedback-form textarea::placeholder {
    color: #504030;
  }
  .feedback-submit {
    padding: 12px 28px;
    background: linear-gradient(135deg, #7a5aaa, #da8c5c);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 0.85em;
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .feedback-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(122,90,170,0.15);
  }
  .feedback-submit:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }
  .feedback-status {
    font-size: 0.78em;
    color: #6a8a6a;
    margin-top: 8px;
    min-height: 1.5em;
  }

  /* ===== 天命题 ===== */
  .fate-card {
    background: linear-gradient(160deg, rgba(38,18,28,0.96), rgba(18,16,32,0.98));
    border: 1px solid rgba(246,211,101,0.12);
    border-radius: 18px;
    padding: 44px 32px;
    text-align: center;
    display: none;
  }
  .fate-card.active { display: block; animation: fateIn 0.7s ease; }

  @keyframes fateIn {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }

  .fate-icon { font-size: 2.8em; margin-bottom: 12px; }
  .fate-label {
    font-size: 0.65em;
    color: #da8c5c;
    letter-spacing: 4px;
    margin-bottom: 10px;
  }
  .fate-prompt {
    font-family: 'PingFang SC', 'Microsoft YaHei', cursive;
    font-size: 1.5em;
    color: #f0e0c0;
    line-height: 1.6;
    margin-bottom: 28px;
    padding: 0 8px;
  }
  .fate-btn {
    display: inline-block;
    padding: 14px 44px;
    background: linear-gradient(135deg, #f6d365, #da8c5c);
    border: none;
    border-radius: 50px;
    color: #1a1a2a;
    font-size: 1.05em;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
    letter-spacing: 3px;
  }
  .fate-btn:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 10px 30px rgba(246,211,101,0.2);
  }
  .fate-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }
  .fate-reveal {
    margin-top: 22px;
    font-size: 1.4em;
    color: #f6d365;
    font-family: 'PingFang SC', 'Microsoft YaHei', cursive;
    min-height: 2em;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .fate-reveal.show { opacity: 1; }

  /* ===== 结果页 ===== */
  .result-card {
    display: none;
    animation: fadeIn 0.7s ease;
  }
  .result-card.active { display: block; }

  .result-header {
    text-align: center;
    padding: 20px 0 10px;
  }
  .result-header .label {
    font-size: 0.75em;
    color: #a09080;
    letter-spacing: 4px;
  }
  .result-header .name {
    font-family: 'PingFang SC', 'Microsoft YaHei', cursive;
    font-size: 2.8em;
    background: linear-gradient(135deg, #f6d365, #da8c5c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 2px 0;
  }
  .result-header .title-line {
    color: #c0a890;
    font-size: 0.9em;
  }

  .art-container {
    display: flex;
    justify-content: center;
    margin: 16px 0 24px;
  }
  .art-container svg {
    max-width: 180px;
    height: auto;
    filter: drop-shadow(0 0 30px rgba(246,211,101,0.08));
  }

  /* 书法角色卡（替代简笔画） */
  .calligraphy-card {
    width: 160px;
    height: 160px;
    border: 2px solid rgba(246,211,101,0.2);
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 30%, rgba(246,211,101,0.04), transparent 70%);
    position: relative;
  }
  .calligraphy-card .big-icon {
    font-size: 2.8em;
    line-height: 1;
    margin-bottom: 2px;
  }
  .calligraphy-card .charname {
    font-family: 'PingFang SC', 'Microsoft YaHei', cursive;
    font-size: 1.4em;
    background: linear-gradient(135deg, #f6d365, #da8c5c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 3px;
  }
  .calligraphy-card .charname-sub {
    font-size: 0.6em;
    color: #a09080;
    letter-spacing: 2px;
    margin-top: 2px;
  }
  .calligraphy-card .deco-dot {
    position: absolute;
    width: 4px;
    height: 4px;
    background: rgba(246,211,101,0.15);
    border-radius: 50%;
  }
  .calligraphy-card .deco-line {
    position: absolute;
    height: 1px;
    background: rgba(246,211,101,0.08);
  }

  .result-body {
    background: rgba(255,215,150,0.03);
    border: 1px solid rgba(255,215,150,0.07);
    border-radius: 14px;
    padding: 24px;
    margin: 8px 0 16px;
  }
  .result-body h3 {
    color: #f6d365;
    font-size: 0.9em;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .result-body p {
    color: #c8c0b0;
    line-height: 1.85;
    font-size: 0.92em;
  }

  .result-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin: 14px 0 4px;
  }
  .result-tags span {
    display: inline-block;
    padding: 3px 12px;
    background: rgba(246,211,101,0.07);
    border: 1px solid rgba(246,211,101,0.12);
    border-radius: 16px;
    font-size: 0.72em;
    color: #e8c87a;
  }

  /* ===== 分数总览 ===== */
  .score-section {
    margin: 16px 0;
    padding: 20px;
    background: rgba(255,215,150,0.02);
    border: 1px solid rgba(255,215,150,0.05);
    border-radius: 14px;
  }
  .score-section h3 {
    color: #a09080;
    font-size: 0.75em;
    letter-spacing: 3px;
    margin-bottom: 14px;
    text-align: center;
  }
  .score-bars { display: flex; flex-direction: column; gap: 6px; }
  .score-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .score-row .sname {
    width: 48px;
    font-size: 0.72em;
    color: #b0a090;
    text-align: right;
    flex-shrink: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .score-row .sbar-wrap {
    flex: 1;
    height: 14px;
    background: rgba(255,255,255,0.03);
    border-radius: 7px;
    overflow: hidden;
    position: relative;
  }
  .score-row .sbar {
    height: 100%;
    border-radius: 7px;
    transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    min-width: 2px;
  }
  .score-row .sval {
    font-size: 0.68em;
    color: #807060;
    width: 34px;
    font-variant-numeric: tabular-nums;
  }
  .score-row .sbar.pos { background: linear-gradient(90deg, #da8c5c, #f6d365); }
  .score-row .sbar.neg { background: linear-gradient(90deg, #5c3a4a, #8c4a5a); }

  .btn-group {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .btn-primary, .btn-secondary, .btn-fate {
    padding: 12px 24px;
    border: none;
    border-radius: 12px;
    font-size: 0.9em;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.25s ease;
    flex: 1;
    text-align: center;
  }
  .btn-primary {
    background: linear-gradient(135deg, #f6d365, #da8c5c);
    color: #1a1a2a;
    font-weight: 700;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(246,211,101,0.18); }
  .btn-secondary {
    background: transparent;
    border: 1px solid rgba(255,215,150,0.18);
    color: #c0a890;
  }
  .btn-secondary:hover { background: rgba(255,215,150,0.06); border-color: rgba(255,215,150,0.28); }
  .btn-fate {
    background: linear-gradient(135deg, #4a2a3a, #6a3a4a);
    border: 1px solid rgba(218,140,92,0.15);
    color: #d8b8b8;
  }
  .btn-fate:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(138,76,90,0.15); }

  /* ===== 角色图鉴 ===== */
  .all-characters {
    margin-top: 44px;
    padding-top: 28px;
    border-top: 1px solid rgba(255,215,150,0.06);
    display: none;
  }
  .all-characters.active { display: block; }
  .all-characters > h3 {
    text-align: center;
    color: #a09080;
    font-size: 0.8em;
    letter-spacing: 4px;
    margin-bottom: 18px;
  }
  .char-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .char-mini {
    text-align: center;
    padding: 10px 4px;
    border-radius: 10px;
    background: rgba(255,215,150,0.02);
    border: 1px solid rgba(255,215,150,0.05);
    cursor: pointer;
    transition: all 0.2s;
  }
  .char-mini:hover { background: rgba(255,215,150,0.07); border-color: rgba(255,215,150,0.12); }
  .char-mini svg { width: 30px; height: 30px; display: block; margin: 0 auto 3px; }
  .char-mini .cname { font-size: 0.6em; color: #b0a090; }
  .char-mini .cscore { font-size: 0.55em; color: #706050; }

  .footer-links {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid rgba(255,215,150,0.05);
  }
  .footer-links a {
    color: #706050;
    text-decoration: none;
    font-size: 0.75em;
    margin: 0 10px;
    transition: color 0.2s;
  }
  .footer-links a:hover { color: #b0a090; }

  /* ===== 电影信息角标 ===== */
  .movie-credit {
    text-align: center;
    margin-top: 12px;
    padding: 10px;
    font-size: 0.6em;
    color: #504030;
    letter-spacing: 1px;
  }
  .movie-credit a { color: #605040; text-decoration: none; }
  .movie-credit a:hover { color: #908070; }

  @media (max-width: 560px) {
    .hero h1 { font-size: 2.2em; }
    .question-card { padding: 24px 16px; }
    .q-title { font-size: 1.05em; }
    .result-header .name { font-size: 2em; }
    .char-grid { grid-template-columns: repeat(5, 1fr); gap: 5px; }
    .btn-group { flex-direction: column; }
    .art-container svg { max-width: 150px; }
    .fate-prompt { font-size: 1.2em; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="hero">
    <div class="movie-badge">✦ 2026 暑期档 · 国漫黑马 ✦</div>
    <h1>八 仙 <span class="exclaim">！</span></h1>
    <p>测一测 · 你是《八仙！》里的哪位？</p>
    <div class="subtitle">✦ 草台班子人格测验 ✦</div>
  </div>

  <!-- 进度条 -->
  <div class="progress-bar" id="progressBar">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-text" id="progressText">0/0</span>
  </div>

  <!-- 题目区 -->
  <div id="quizArea"></div>

  <!-- 天命题区 -->
  <div id="fateArea"></div>

  <!-- 结果区 -->
  <div class="result-card" id="resultCard">
    <div class="result-header">
      <div class="label">✦ 你的草台班子身份 ✦</div>
      <div class="name" id="resultName">—</div>
      <div class="title-line" id="resultTitle">—</div>
    </div>
    <div class="art-container" id="resultArt"></div>

    <div class="result-body">
      <h3>▎ 角 色 档 案</h3>
      <p id="resultDesc"></p>
      <div class="result-tags" id="resultTags"></div>
      <div class="profile-badges" id="profileBadges"></div>
    </div>

    <div class="score-section">
      <h3>— 仙 班 排 名 —</h3>
      <div class="score-bars" id="scoreBars"></div>
    </div>

    <div class="btn-group">
      <button class="btn-primary" onclick="showAllCharacters()">✦ 全部角色</button>
      <button class="btn-secondary" onclick="restartQuiz()">↻ 重新测试</button>
      <button class="btn-fate" onclick="location.href='fate.html'">☯ 纯天命版</button>
    </div>
  </div>

  <!-- 全部角色图鉴 -->
  <div class="all-characters" id="allCharacters">
    <h3>— 《八仙！》角 色 全 图 鉴 —</h3>
    <div class="char-grid" id="charGrid"></div>
  </div>

  <!-- ===== 意见箱 ===== -->
  <div class="feedback-section" id="feedbackSection">
    <h3>💌 意 见 箱</h3>
    <p>对测试有什么建议或想法？欢迎告诉我</p>
    <div class="feedback-form">

// ===================================================================
//  状态
// ===================================================================
let currentQ = 0;
let scores = {};
let totalQuestions = QUESTIONS.length;
let fateAsked = 0;
const MAX_FATE = 2;
let answerHistory = [];  // { qIndex, optIndex }

function initScores() {
  scores = {};
  answerHistory = [];
  CHARACTERS.forEach(ch => { scores[ch.id] = 0; });
}

// ===================================================================
//  SVG 简笔画（电影《八仙！》风格 — 偏卡通、烟火气）

function getArt(id) {

    tieguaili: { icon: '🍜', name: '铁拐李', sub: '烟火人间' },
    caoguojiu: { icon: '📿', name: '曹国舅', sub: '贵气憨憨' },
    lancaihe: { icon: '🏮', name: '蓝采和', sub: '赤子之心' },
    hanxiangzi: { icon: '🎵', name: '韩湘子', sub: '妙音天成' },
    zhangguolao: { icon: '🐴', name: '张果老', sub: '大智若愚' },

// ===================================================================
//  渲染
// ===================================================================
function renderQuestion(index) {
  const q = QUESTIONS[index];
  if (!q) return;
  const total = QUESTIONS.length;
  document.getElementById('progressFill').style.width = Math.round((index / total) * 100) + '%';
  document.getElementById('progressText').textContent = `${index}/${total}`;

  // 标记已选过的选项
  const prevOpt = answerHistory.find(h => h.qIndex === index);
  const prevOptIdx = prevOpt ? prevOpt.optIndex : -1;

  document.getElementById('quizArea').innerHTML = `
    <div class="question-card active">
      <div class="q-number">第 ${index + 1} 题 / 共 ${total} 题</div>
      <div class="q-title">${q.q}</div>
      <div class="options">
        ${q.opts.map((opt, i) => `<button class="option-btn${i === prevOptIdx ? ' selected' : ''}" onclick="selectOption(this, ${index})">${opt.text}</button>`).join('')}
      </div>
      <div class="q-nav">
        <button class="back-btn" onclick="goBack()" ${index === 0 ? 'disabled' : ''}>← 上一题</button>
        <span class="q-counter">${index + 1} / ${total}</span>
      </div>
    </div>
  `;
}

function selectOption(btn, qIndex) {
  const q = QUESTIONS[qIndex];
  const optIndex = Array.from(btn.parentElement.children).indexOf(btn);
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');

  // 如果已经答过这一题，先撤销之前的分数
  const prev = answerHistory.find(h => h.qIndex === qIndex);
  if (prev) {
    const prevOpt = QUESTIONS[qIndex].opts[prev.optIndex];
    for (const [cid, val] of Object.entries(prevOpt.map)) {
      if (scores[cid] !== undefined) scores[cid] -= val;
    }
    prev.optIndex = optIndex;
  } else {
    answerHistory.push({ qIndex, optIndex });
  }

  const opt = q.opts[optIndex];
  for (const [cid, val] of Object.entries(opt.map)) {
    if (scores[cid] !== undefined) scores[cid] += val;
  }

  setTimeout(() => {
    currentQ = Math.max(currentQ, qIndex + 1);
    if (currentQ < QUESTIONS.length) renderQuestion(currentQ);
    else checkTies();
  }, 300);
}

function goBack() {
  if (currentQ <= 0 || answerHistory.length === 0) return;
  currentQ--;
  // 如果当前题目已经回答过，撤销分数
  const prev = answerHistory.find(h => h.qIndex === currentQ);
  if (prev) {
    const opt = QUESTIONS[currentQ].opts[prev.optIndex];
    for (const [cid, val] of Object.entries(opt.map)) {
      if (scores[cid] !== undefined) scores[cid] -= val;
    }
    answerHistory = answerHistory.filter(h => h.qIndex !== currentQ);
  }
  renderQuestion(currentQ);
}

// ===================================================================
//  平局 → 天命题
// ===================================================================
function checkTies() {
  const sorted = getSortedScores();
  const topScore = sorted[0]?.score || 0;
  const tied = sorted.filter(s => s.score === topScore);

  if (tied.length >= 2 && fateAsked < MAX_FATE) askFateQuestion(sorted);
  else showResult(sorted);
}

function getSortedScores() {
  return CHARACTERS.map(ch => ({ id: ch.id, name: ch.name, score: scores[ch.id] || 0 }))
    .sort((a, b) => b.score - a.score);
}

// ===================================================================
//  天命题
// ===================================================================
function askFateQuestion(sorted) {
  document.getElementById('quizArea').style.display = 'none';
  const fq = FATE_QUESTIONS[fateAsked % FATE_QUESTIONS.length];

  document.getElementById('fateArea').innerHTML = `
    <div class="fate-card active">
      <div class="fate-icon">${fq.icon}</div>
      <div class="fate-label">✦ 天 命 题 ✦</div>
      <div class="fate-prompt">${fq.prompt.replace(/\n/g, '<br>')}</div>
      <button class="fate-btn" id="fateBtn" onclick="resolveFate()">☯ 听 凭 天 命</button>
      <div class="fate-reveal" id="fateReveal"></div>
    </div>
  `;
  document.getElementById('progressText').textContent = '✦ 天命';
}

function resolveFate() {
  const btn = document.getElementById('fateBtn');
  btn.disabled = true;
  btn.textContent = '☯ 命 运 回 响 …';

  const fq = FATE_QUESTIONS[fateAsked % FATE_QUESTIONS.length];
  // 加权随机选
  const entries = Object.entries(fq.weights);
  const total = entries.reduce((s, [, v]) => s + v, 0);
  let r = Math.random() * total;
  let chosen = entries[0][0];
  for (const [id, w] of entries) {
    r -= w;
    if (r <= 0) { chosen = id; break; }
  }

  scores[chosen] += 18;
  const ch = CHARACTERS.find(c => c.id === chosen);
  const reveal = document.getElementById('fateReveal');
  reveal.textContent = `☯ 天命眷顾 · ${ch.name} (+18)`;
  setTimeout(() => reveal.classList.add('show'), 100);

  fateAsked++;
  setTimeout(() => {
    document.getElementById('fateArea').innerHTML = '';
    document.getElementById('quizArea').style.display = 'block';
    checkTies();
  }, 1800);
}

// ===================================================================
//  结果
// ===================================================================
function showResult(sorted) {
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('fateArea').innerHTML = '';
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressText').textContent = '✨';

  const top = sorted[0];
  const ch = CHARACTERS.find(c => c.id === top.id);
  if (!ch) return;

  const card = document.getElementById('resultCard');
  card.classList.add('active');
  document.getElementById('resultName').textContent = ch.name;
  document.getElementById('resultTitle').textContent = ch.title;
  document.getElementById('resultArt').innerHTML = getArt(ch.id);
  document.getElementById('resultDesc').textContent = ch.desc;
  document.getElementById('resultTags').innerHTML = ch.tags.map(t => `<span>${t}</span>`).join('');

  // 显示星座 & MBTI
  const badgeHtml = [];
  if (ch.zodiac) badgeHtml.push(`<span class="badge-zodiac">${ch.zodiacIcon || ''} ${ch.zodiac}</span>`);
  if (ch.mbti) badgeHtml.push(`<span class="badge-mbti">${ch.mbti} · ${ch.mbtiLabel || ''}</span>`);
  document.getElementById('profileBadges').innerHTML = badgeHtml.join('');

  // 显示意见箱
  document.getElementById('feedbackSection').classList.add('active');

  renderScoreBars(sorted);
  setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
}

function renderScoreBars(sorted) {
  const container = document.getElementById('scoreBars');
  const absMax = Math.max(...sorted.map(s => Math.abs(s.score)), 1);

  container.innerHTML = sorted.map((s, idx) => {
    const pct = (s.score / absMax) * 100;
    return `
      <div class="score-row">
        <span class="sname" style="color:${idx === 0 ? '#f6d365' : '#b0a090'};font-weight:${idx === 0 ? '700' : '400'}">${s.name}</span>
        <div class="sbar-wrap"><div class="sbar ${s.score >= 0 ? 'pos' : 'neg'}" style="width:0%"></div></div>
        <span class="sval" style="color:${idx === 0 ? '#f6d365' : '#807060'}">${s.score > 0 ? '+' : ''}${s.score}</span>
      </div>
    `;
  }).join('');

  setTimeout(() => {
    const sortedNow = getSortedScores();
    const absMax2 = Math.max(...sortedNow.map(s => Math.abs(s.score)), 1);
    container.querySelectorAll('.sbar').forEach((bar, i) => {
      setTimeout(() => { bar.style.width = Math.abs((sortedNow[i].score / absMax2) * 100) + '%'; }, i * 60);
    });
  }, 200);
}

// ===================================================================
//  图鉴
// ===================================================================
function showAllCharacters() {
  const el = document.getElementById('allCharacters');
  el.classList.toggle('active');
  const grid = document.getElementById('charGrid');
  if (grid.children.length === 0) {
    const sorted = getSortedScores();
    grid.innerHTML = CHARACTERS.map(ch => {
      const sc = sorted.find(s => s.id === ch.id);
      return `<div class="char-mini" onclick="showCharacter('${ch.id}')">
        ${getArt(ch.id)}
        <div class="cname">${ch.name}</div>
        <div class="cscore">${sc ? (sc.score > 0 ? '+' : '') + sc.score : '0'}</div>
      </div>`;
    }).join('');
  }
  if (el.classList.contains('active')) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
}

function showCharacter(id) {
  const ch = CHARACTERS.find(c => c.id === id);
  if (!ch) return;
  document.getElementById('resultName').textContent = ch.name;
  document.getElementById('resultTitle').textContent = ch.title;
  document.getElementById('resultArt').innerHTML = getArt(ch.id);
  document.getElementById('resultDesc').textContent = ch.desc;
  document.getElementById('resultTags').innerHTML = ch.tags.map(t => `<span>${t}</span>`).join('');
  const badgeHtml = [];
  if (ch.zodiac) badgeHtml.push(`<span class="badge-zodiac">${ch.zodiacIcon || ''} ${ch.zodiac}</span>`);
  if (ch.mbti) badgeHtml.push(`<span class="badge-mbti">${ch.mbti} · ${ch.mbtiLabel || ''}</span>`);
  document.getElementById('profileBadges').innerHTML = badgeHtml.join('');
  document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function restartQuiz() {
  currentQ = 0; fateAsked = 0; initScores();
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('fateArea').innerHTML = '';
  document.getElementById('resultCard').classList.remove('active');
  document.getElementById('allCharacters').classList.remove('active');
  document.getElementById('feedbackSection').classList.remove('active');
  document.getElementById('feedbackStatus').textContent = '';
  renderQuestion(0);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

const FEEDBACK_ENDPOINT = 'https://formsubmit.co/ajax/2538894931@qq.com';

function sendFeedback() {
  const text = document.getElementById('feedbackText').value.trim();
  const email = document.getElementById('feedbackEmail').value.trim();
  const status = document.getElementById('feedbackStatus');

  if (!text) {
    status.textContent = '请先写点什么～';
    status.style.color = '#b06060';
    return;
  }

  const btn = document.querySelector('.feedback-submit');
  btn.disabled = true;
  btn.textContent = '📨 发送中…';
  status.textContent = '';

  // 通过 AJAX POST 到 Formspree，直接转发到你的邮箱
  fetch(FEEDBACK_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify({
      message: text + (email ? '\n\n来自：' + email : ''),
      _subject: '《八仙！》人格测试 · 意见反馈',
      _captcha: false
    })
  })
  .then(res => {
    if (res.ok) {
      status.textContent = '✅ 已发送！感谢你的意见 🙏';
      status.style.color = '#6a8a6a';
      document.getElementById('feedbackText').value = '';
      document.getElementById('feedbackEmail').value = '';
    } else {
      throw new Error('发送失败');
    }
  })
  .catch(() => {
    status.textContent = '❌ 发送失败，请检查 FEEDBACK_ENDPOINT 是否配置正确';
    status.style.color = '#b06060';
  })
  .finally(() => {
    btn.disabled = false;
    btn.textContent = '📨 发送';
  });
}

initScores();
renderQuestion(0);
</script>

</body>
</html>
