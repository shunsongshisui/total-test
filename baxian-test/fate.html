<style>
  /* 字体使用系统默认，确保国内可无阻碍访问 */

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #08060e;
    color: #e8e0d0;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(100,60,140,0.04), transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(218,140,92,0.03), transparent 50%);

    z-index: 0;
  }

  .container {
    max-width: 600px;
    margin: 0 auto;
    padding: 40px 20px 60px;
    position: relative;
    z-index: 1;
    text-align: center;
  }

  .hero { padding: 30px 0 18px; }
  .hero .badge {
    display: inline-block;
    background: rgba(218,140,92,0.1);
    border: 1px solid rgba(218,140,92,0.15);
    border-radius: 6px;
    padding: 2px 10px;
    font-size: 0.55em;
    color: #da8c5c;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }
  .hero h1 {
    font-family: 'PingFang SC', 'Microsoft YaHei', cursive;
    font-size: 2.4em;
    background: linear-gradient(135deg, #a080c0, #da8c5c, #f6d365);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 6px;
    line-height: 1.3;
  }
  .hero p {
    color: #706080;
    font-size: 0.85em;
    margin-top: 4px;
    letter-spacing: 2px;
  }

  .progress-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 24px 0 20px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #2a2a3a;
    transition: all 0.4s ease;
  }
  .dot.active { background: #da8c5c; box-shadow: 0 0 12px rgba(218,140,92,0.3); }
  .dot.done { background: #6a5a4a; }

  /* 天命卡片 */
  .fate-screen { display: none; }
  .fate-screen.active { display: block; animation: fateRise 0.8s ease; }

  @keyframes fateRise {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .fate-card {
    background: linear-gradient(160deg, rgba(30,20,48,0.96), rgba(16,12,30,0.98));
    border: 1px solid rgba(160,128,192,0.12);
    border-radius: 24px;
    padding: 50px 32px;
    position: relative;
    overflow: hidden;
  }

  .fate-card::before {
    content: '☯';
    position: absolute;
    top: -20px; right: -20px;
    font-size: 8em;
    opacity: 0.025;
    transform: rotate(30deg);
  }

  .fate-step { font-size: 0.6em; color: #6a5a7a; letter-spacing: 4px; }
  .fate-icon { font-size: 3.2em; margin: 12px 0; }
  .fate-text {
    font-family: 'PingFang SC', 'Microsoft YaHei', cursive;
    font-size: 1.5em;
    color: #d8cce0;
    line-height: 1.7;
    margin: 12px 0 32px;
    padding: 0 4px;
    min-height: 3em;
  }

  .fate-btn {
    display: inline-block;
    padding: 16px 52px;
    background: linear-gradient(135deg, #7a5aaa, #da8c5c);
    border: none;
    border-radius: 50px;
    color: #fff;
    font-size: 1.1em;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
    letter-spacing: 4px;
    box-shadow: 0 4px 20px rgba(122,90,170,0.15);
  }
  .fate-btn:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 12px 35px rgba(122,90,170,0.25);
  }
  .fate-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none !important;
    box-shadow: none !important;
  }

  .fate-reveal {
    margin-top: 24px;
    min-height: 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .fate-reveal.show { opacity: 1; }

  .reveal-char {
    font-family: 'PingFang SC', 'Microsoft YaHei', cursive;
    font-size: 1.8em;
    color: #f6d365;
  }
  .reveal-line {
    font-size: 0.8em;
    color: #9080a0;
    line-height: 1.6;
    max-width: 360px;
  }
  .reveal-sub {
    font-size: 0.7em;
    color: #605070;
  }

  /* 结果 */
  .result-card {
    display: none;
    animation: fateRise 0.8s ease;
    margin-top: 10px;
  }
  .result-card.active { display: block; }

  .result-header .rlabel {
    font-size: 0.65em;

  }
  .result-header .rtitle {
    color: #a09080;
    font-size: 0.9em;
  }

    margin: 16px 0 20px;

    padding: 24px;
    margin: 8px 0 16px;

  .result-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; justify-content: center; }
  .result-tags span {

    font-size: 0.7em;
    color: #c0a8d0;
  }

  .btn-group { display: flex; gap: 10px; margin-top: 16px; }
  .btn-primary, .btn-secondary {
    padding: 12px 24px;

    border-radius: 12px;

    transition: all 0.25s ease;

  }
  .btn-primary {
    background: linear-gradient(135deg, #7a5aaa, #da8c5c);

  .btn-secondary {

    border: 1px solid rgba(160,128,192,0.15);
    color: #9080a0;
  }
  .btn-secondary:hover { background: rgba(160,128,192,0.06); }

  .footer-links { margin-top: 32px; padding-top: 16px; }
  .footer-links a {
    color: #504060;
    text-decoration: none;
    font-size: 0.7em;
    margin: 0 10px;
    transition: color 0.2s;
  }
  .footer-links a:hover { color: #9080a0; }

  @media (max-width: 480px) {
    .hero h1 { font-size: 1.8em; }
    .fate-text { font-size: 1.2em; }
    .result-header .rname { font-size: 2em; }
    .btn-group { flex-direction: column; }
    .art-container svg { max-width: 140px; }
  }
</style>
</head>

let step = 0;
const TOTAL_STEPS = 10;
let fateScores = {};

function init() {
  fateScores = {};
  CHARACTERS.forEach(ch => { fateScores[ch.id] = 0; });
  renderDots();
  showFate();
}

function renderDots() {
  const container = document.getElementById('progressDots');
  container.innerHTML = '';
  for (let i = 0; i < TOTAL_STEPS; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i < step ? ' done' : '') + (i === step ? ' active' : '');
    container.appendChild(dot);
  }
}

function showFate() {
  document.getElementById('fateScreen').classList.add('active');
  document.getElementById('resultCard').classList.remove('active');

  if (step >= TOTAL_STEPS) {
    finishFate();
    return;
  }

  const f = FATES[step];
  console.log('showFate(' + step + '):', f ? f.icon : 'FATES[' + step + '] is UNDEFINED');
  if (!f) { finishFate(); return; }  // 安全兜底
  // 先设置内容，再设题号——方便排查
  document.getElementById('fateIcon').textContent = f.icon;
  document.getElementById('fateText').innerHTML = f.text;
  document.getElementById('fateStep').textContent = `第 ${step + 1} / ${TOTAL_STEPS} 问`;

  const btn = document.getElementById('fateBtn');
  btn.disabled = false;
  btn.textContent = '☯ 听 凭 天 命';

  const reveal = document.getElementById('fateReveal');
  reveal.classList.remove('show');
  reveal.innerHTML = '';

  renderDots();
}

function drawFate() {
  const btn = document.getElementById('fateBtn');
  btn.disabled = true;
  btn.textContent = '☯ 命 运 回 响 …';

  // 终极安全兜底：5秒后无论什么原因都恢复按钮
  const safetyTimer = setTimeout(() => {
    btn.disabled = false;
    btn.textContent = '☯ 听 凭 天 命';
  }, 5000);

  try {
    // 安全检查：防止数组越界
    if (step >= TOTAL_STEPS) { finishFate(); return; }
    if (!FATES[step] || !FATE_BIAS[step]) { finishFate(); return; }

    // 加权随机 — 大幅增加随机扰动，让每次结果都不同
    const bias = FATE_BIAS[step] || {};
    const weights = CHARACTERS.map(ch => {
      const w = bias[ch.id] || 1.0;
      // 强随机扰动：0 ~ 3.0 倍
      return { id: ch.id, w: w * (Math.random() * 3.0) };
    });

    const totalW = weights.reduce((s, x) => s + x.w, 0);
    let r = Math.random() * totalW;
    let chosen = weights[0].id;
    for (const { id, w } of weights) {
      r -= w;
      if (r <= 0) { chosen = id; break; }
    }

    // 每轮分差更大：5~25 分
    const increment = 5 + Math.floor(Math.random() * 21);
    if (!fateScores[chosen]) fateScores[chosen] = 0;
    fateScores[chosen] += increment;

    const ch = CHARACTERS.find(c => c.id === chosen);
    if (!ch) { finishFate(); return; }

    // 显示命运回响
    const reveal = document.getElementById('fateReveal');
    const lines = [
      '命运指向了……',
      '天命选择了……',
      '星盘上写着……',
      '冥冥之中……'
    ];
    reveal.innerHTML = `
      <div class="reveal-sub">${lines[Math.floor(Math.random() * lines.length)]}</div>
      <div class="reveal-char">${ch.icon} ${ch.name}</div>
      <div class="reveal-line">${ch.title}</div>
      <div class="reveal-sub">天命之力 +${increment}</div>
    `;
    setTimeout(() => reveal.classList.add('show'), 100);

    step++;
    setTimeout(() => {
      clearTimeout(safetyTimer);
      try {
        if (step < TOTAL_STEPS) showFate();
        else finishFate();
      } catch (e) {
        console.error('advance error:', e);
        btn.disabled = false;
        btn.textContent = '☯ 听 凭 天 命';
      }
    }, 2000);

  } catch (e) {
    // 错误恢复：确保按钮永远不会卡死
    console.error('drawFate error:', e);
    btn.disabled = false;
    btn.textContent = '☯ 听 凭 天 命';
  }
}


/* ============ 保存 / 分享结果图片 ============ */
function __baxianSpec() {
    const nameEl = document.getElementById('resultName');
    const titleEl = document.getElementById('resultTitle');
    const descEl = document.getElementById('resultDesc');
    const tagsEl = document.getElementById('resultTags');
    const name = nameEl ? nameEl.textContent.trim() : '';
    const title = titleEl ? titleEl.textContent.trim() : '';
    const desc = descEl ? descEl.textContent.trim() : '';
    let tags = [];
    if (tagsEl) {
        tags = Array.prototype.slice.call(tagsEl.querySelectorAll('span'))
            .map(function (s) { return s.textContent.trim(); })
            .filter(Boolean).slice(0, 4);
    }
    return {
        theme: 'teal',
        tag: '八仙人格',
        title: '八仙人格测试 · 天命版',
        value: name || '—',
        unit: '',
        badge: title.replace(/^[「『]|[」』]$/g, ''),
        note: desc.length > 90 ? desc.slice(0, 90) + '…' : desc,
        chips: tags.map(function (t) { return { label: '特质', value: t }; }),
        radar: [],
        radarRef: [],
        footer: '八仙人格测试 · 仅供娱乐与自我探索'
    };
}

function saveResultImage(btn) {
    if (typeof ShareCard === 'undefined' || !ShareCard.save) {
        alert('图片组件未加载，请刷新页面重试。');
        return;
    }
    try { ShareCard.save(__baxianSpec(), btn); }
    catch (e) { console.error('[saveResultImage]', e); alert('生成图片失败，请重试。'); }
}

function shareResultImage(btn) {
    if (typeof ShareCard === 'undefined' || !ShareCard.share) {
        alert('图片组件未加载，请刷新页面重试。');
        return;
    }
    try { ShareCard.share(__baxianSpec(), btn); }
    catch (e) { console.error('[shareResultImage]', e); alert('分享失败，请重试。'); }
}

function finishFate() {
  document.getElementById('fateScreen').classList.remove('active');
  renderDots();

  // 找出最高分
  const sorted = CHARACTERS.map(ch => ({
    id: ch.id,
    name: ch.name,
    score: fateScores[ch.id] || 0
  })).sort((a, b) => b.score - a.score);

  const top = sorted[0];
  const ch = CHARACTERS.find(c => c.id === top.id);
  if (!ch) return;

  const card = document.getElementById('resultCard');
  card.classList.add('active');

  // 用全面版的svg art函数
  const art = getArt(ch.id);
  document.getElementById('resultName').textContent = ch.name;
  document.getElementById('resultTitle').textContent = ch.title;
  document.getElementById('resultArt').innerHTML = art;
  document.getElementById('resultDesc').textContent = ch.desc;
  document.getElementById('resultTags').innerHTML = ch.tags.map(t => `<span>${t}</span>`).join('');

  setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
}

function restartFate() {
  step = 0;
  init();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
