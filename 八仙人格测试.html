<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>八仙人格测试 · 国漫风</title>
<style>
  /* 字体使用系统默认，确保国内可无阻碍访问 */

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0a0a1a;
    color: #e8e0d0;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 背景星空 */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,200,0.3), transparent),
      radial-gradient(1px 1px at 30% 60%, rgba(255,255,200,0.2), transparent),
      radial-gradient(1.5px 1.5px at 50% 10%, rgba(255,255,200,0.4), transparent),
      radial-gradient(1px 1px at 70% 40%, rgba(255,255,200,0.2), transparent),
      radial-gradient(1px 1px at 90% 80%, rgba(255,255,200,0.3), transparent),
      radial-gradient(1.5px 1.5px at 15% 85%, rgba(255,255,200,0.25), transparent),
      radial-gradient(1px 1px at 45% 45%, rgba(255,255,200,0.15), transparent),
      radial-gradient(1px 1px at 80% 15%, rgba(255,255,200,0.3), transparent),
      radial-gradient(1.2px 1.2px at 60% 75%, rgba(255,255,200,0.2), transparent),
      radial-gradient(1px 1px at 35% 90%, rgba(255,255,200,0.15), transparent);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 30px 20px 60px;
    position: relative;
    z-index: 1;
  }

  /* 标题区 */
  .hero {
    text-align: center;
    padding: 40px 0 30px;
  }
  .hero h1 {
    font-family: 'PingFang SC', 'Microsoft YaHei', cursive;
    font-size: 2.8em;
    background: linear-gradient(135deg, #f6d365, #da8c5c, #e8b87a, #f6d365);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 4s ease-in-out infinite;
    text-shadow: none;
    letter-spacing: 4px;
  }
  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .hero p {
    color: #a09080;
    margin-top: 10px;
    font-size: 1em;
    letter-spacing: 2px;
  }
  .hero .subtitle {
    display: inline-block;
    background: rgba(255,215,150,0.08);
    border: 1px solid rgba(255,215,150,0.15);
    border-radius: 20px;
    padding: 4px 18px;
    font-size: 0.8em;
    color: #c0a890;
    margin-top: 8px;
  }

  /* 进度 */
  .progress-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 30px;
  }
  .progress-track {
    flex: 1;
    height: 4px;
    background: #2a2a3a;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #f6d365, #da8c5c);
    border-radius: 2px;
    transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .progress-text {
    font-size: 0.8em;
    color: #a09080;
    min-width: 40px;
    text-align: right;
  }

  /* 题目卡片 */
  .question-card {
    background: linear-gradient(160deg, rgba(30,25,40,0.95), rgba(20,18,35,0.98));
    border: 1px solid rgba(255,215,150,0.1);
    border-radius: 20px;
    padding: 40px 35px;
    backdrop-filter: blur(10px);
    display: none;
    animation: fadeIn 0.5s ease;
  }
  .question-card.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .q-number {
    font-size: 0.75em;
    color: #da8c5c;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .q-title {
    font-size: 1.3em;
    font-weight: 700;
    color: #f0e8d8;
    line-height: 1.6;
    margin-bottom: 25px;
  }

  .options { display: flex; flex-direction: column; gap: 12px; }

  .option-btn {
    display: block;
    width: 100%;
    padding: 16px 22px;
    background: rgba(255,215,150,0.04);
    border: 1px solid rgba(255,215,150,0.12);
    border-radius: 14px;
    color: #d0c8b8;
    font-size: 1em;
    cursor: pointer;
    transition: all 0.25s ease;
    text-align: left;
    font-family: inherit;
    line-height: 1.5;
  }
  .option-btn:hover {
    background: rgba(255,215,150,0.1);
    border-color: rgba(246,211,101,0.3);
    transform: translateX(4px);
    color: #f0e8d8;
  }
  .option-btn:active { transform: translateX(2px) scale(0.99); }

  /* 结果页 */
  .result-card {
    display: none;
    animation: fadeIn 0.7s ease;
  }
  .result-card.active { display: block; }

  .result-header {
    text-align: center;
    padding: 20px 0 10px;
  }
  .result-header .label {
    font-size: 0.8em;
    color: #a09080;
    letter-spacing: 3px;
  }
  .result-header .name {
    font-family: 'PingFang SC', 'Microsoft YaHei', cursive;
    font-size: 2.4em;
    color: #f6d365;
    margin: 6px 0;
  }
  .result-header .title-line {
    color: #c0a890;
    font-size: 1em;
  }

  /* SVG 简笔画容器 */
  .art-container {
    display: flex;
    justify-content: center;
    margin: 20px 0 30px;
  }
  .art-container svg {
    max-width: 260px;
    height: auto;
    filter: drop-shadow(0 0 20px rgba(246,211,101,0.08));
  }

  .result-body {
    background: rgba(255,215,150,0.03);
    border: 1px solid rgba(255,215,150,0.08);
    border-radius: 16px;
    padding: 28px;
    margin: 10px 0 20px;
  }
  .result-body h3 {
    color: #f6d365;
    font-size: 1em;
    margin-bottom: 10px;
    letter-spacing: 1px;
  }
  .result-body p {
    color: #c8c0b0;
    line-height: 1.8;
    font-size: 0.95em;
  }

  .result-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 16px 0;
  }
  .result-tags span {
    display: inline-block;
    padding: 4px 14px;
    background: rgba(246,211,101,0.08);
    border: 1px solid rgba(246,211,101,0.15);
    border-radius: 20px;
    font-size: 0.78em;
    color: #e8c87a;
  }

  .btn-group {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }
  .btn-primary, .btn-secondary {
    padding: 14px 32px;
    border: none;
    border-radius: 12px;
    font-size: 1em;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.25s ease;
    flex: 1;
    text-align: center;
  }
  .btn-primary {
    background: linear-gradient(135deg, #f6d365, #da8c5c);
    color: #1a1a2a;
    font-weight: 700;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(246,211,101,0.2);
  }
  .btn-secondary {
    background: transparent;
    border: 1px solid rgba(255,215,150,0.2);
    color: #c0a890;
  }
  .btn-secondary:hover {
    background: rgba(255,215,150,0.06);
    border-color: rgba(255,215,150,0.3);
  }

  /* 角色回顾 */
  .all-characters {
    margin-top: 50px;
    padding-top: 30px;
    border-top: 1px solid rgba(255,215,150,0.08);
    display: none;
  }
  .all-characters.active { display: block; }
  .all-characters h3 {
    text-align: center;
    color: #a09080;
    font-size: 0.9em;
    letter-spacing: 3px;
    margin-bottom: 20px;
  }
  .char-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .char-mini {
    text-align: center;
    padding: 12px 6px;
    border-radius: 12px;
    background: rgba(255,215,150,0.03);
    border: 1px solid rgba(255,215,150,0.06);
    cursor: pointer;
    transition: all 0.2s;
  }
  .char-mini:hover {
    background: rgba(255,215,150,0.08);
    border-color: rgba(255,215,150,0.15);
  }
  .char-mini svg {
    width: 40px;
    height: 40px;
    display: block;
    margin: 0 auto 6px;
  }
  .char-mini .cname {
    font-size: 0.72em;
    color: #b0a090;
  }

  /* 音效反馈 */
  .option-btn.selected {
    background: rgba(246,211,101,0.12);
    border-color: rgba(246,211,101,0.3);
    color: #f6d365;
  }

  @media (max-width: 560px) {
    .hero h1 { font-size: 2em; }
    .question-card { padding: 28px 20px; }
    .q-title { font-size: 1.1em; }
    .result-header .name { font-size: 1.8em; }
    .char-grid { grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .btn-group { flex-direction: column; }
    .art-container svg { max-width: 200px; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="hero">

  <div class="result-card" id="resultCard">

    </div>

    </div>

  </div>

  </div>

</div>

// ========== 渲染题目 ==========
function renderQuestion(index) {
  const q = QUESTIONS[index];
  const total = QUESTIONS.length;
  const percent = Math.round((index / total) * 100);

  document.getElementById('progressFill').style.width = percent + '%';
  document.getElementById('progressText').textContent = `${index}/${total}`;

  const area = document.getElementById('quizArea');
  area.innerHTML = `
    <div class="question-card active">
      <div class="q-number">第 ${index + 1} 题 / 共 ${total} 题</div>
      <div class="q-title">${q.q}</div>
      <div class="options">
        ${q.options.map((opt, i) => `
          <button class="option-btn" onclick="selectOption('${opt.key}', this)">
            ${opt.text}
          </button>
        `).join('')}
      </div>
    </div>
  `;
}

// ========== 选择选项 ==========
function selectOption(key, btn) {
  // 视觉反馈
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');

  // 计分
  scores[key]++;

  // 延迟进入下一题
  setTimeout(() => {
    currentQ++;
    if (currentQ < QUESTIONS.length) {
      renderQuestion(currentQ);
    } else {
      showResult();
    }
  }, 300);
}

// ========== 计算结果 ==========
function calculateResult() {
  let bestMatch = null;
  let bestScore = -1;

  for (const im of IMMORTALS) {
    let score = 0;
    for (const k in scores) {
      score += (im.scores[k] || 0) * scores[k];
    }
    // 加上与题目数量的相关性
    if (score > bestScore) {
      bestScore = score;
      bestMatch = im;
    }
  }

  return bestMatch || IMMORTALS[0];
}

// ========== 显示结果 ==========

/* ============ 保存 / 分享结果图片 ============ */
function __baxianSpec() {
    const nameEl = document.getElementById('resultName');
    const titleEl = document.getElementById('resultTitle');
    const descEl = document.getElementById('resultDesc');
    const tagsEl = document.getElementById('resultTags');

    const name = nameEl ? nameEl.textContent.trim() : '';
    const title = titleEl ? titleEl.textContent.trim() : '';
    const desc = descEl ? descEl.textContent.trim() : '';

    // 标签：从结果区已渲染的 tag 读取，最多取 4 个
    let tags = [];
    if (tagsEl) {
        tags = Array.prototype.slice.call(tagsEl.querySelectorAll('span'))
            .map(function (s) { return s.textContent.trim(); })
            .filter(Boolean).slice(0, 4);
    }

    return {
        theme: 'teal',
        tag: '八仙人格',
        title: '八仙人格测试',
        value: name || '—',
        unit: '',
        badge: title.replace(/^[「『]|[」』]$/g, ''),
        note: desc.length > 90 ? desc.slice(0, 90) + '…' : desc,
        chips: tags.map(function (t) { return { label: '特质', value: t }; }),
        radar: [],
        radarRef: [],
        footer: '八仙人格测试 · 仅供娱乐与自我探索'
    };
}

function saveResultImage(btn) {
    if (typeof ShareCard === 'undefined' || !ShareCard.save) {
        alert('图片组件未加载，请刷新页面重试。');
        return;
    }
    try { ShareCard.save(__baxianSpec(), btn); }
    catch (e) { console.error('[saveResultImage]', e); alert('生成图片失败，请重试。'); }
}

function shareResultImage(btn) {
    if (typeof ShareCard === 'undefined' || !ShareCard.share) {
        alert('图片组件未加载，请刷新页面重试。');
        return;
    }
    try { ShareCard.share(__baxianSpec(), btn); }
    catch (e) { console.error('[shareResultImage]', e); alert('分享失败，请重试。'); }
}

function showResult() {
  const result = calculateResult();

  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressText').textContent = '✨';

  const card = document.getElementById('resultCard');
  card.classList.add('active');

  document.getElementById('resultName').textContent = result.name;
  document.getElementById('resultTitle').textContent = result.title;
  document.getElementById('resultArt').innerHTML = getArt(result.id);
  document.getElementById('resultDesc').textContent = result.desc;
  document.getElementById('resultTags').innerHTML = result.tags.map(t => `<span>${t}</span>`).join('');

  // 滚动到结果
  setTimeout(() => {
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 200);
}

// ========== 全部八仙 ==========
function showAllCharacters() {
  const el = document.getElementById('allCharacters');
  el.classList.toggle('active');

  const grid = document.getElementById('charGrid');
  if (grid.children.length === 0) {
    grid.innerHTML = IMMORTALS.map(im => `
      <div class="char-mini" onclick="showCharacter('${im.id}')">
        ${getArt(im.id)}
        <div class="cname">${im.name}</div>
      </div>
    `).join('');
  }

  if (el.classList.contains('active')) {
    setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
  }
}

function showCharacter(id) {
  const im = IMMORTALS.find(i => i.id === id);
  if (!im) return;
  document.getElementById('resultName').textContent = im.name;
  document.getElementById('resultTitle').textContent = im.title;
  document.getElementById('resultArt').innerHTML = getArt(im.id);
  document.getElementById('resultDesc').textContent = im.desc;
  document.getElementById('resultTags').innerHTML = im.tags.map(t => `<span>${t}</span>`).join('');
  document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ========== 重新测试 ==========
function restartQuiz() {
  currentQ = 0;
  scores = { A: 0, B: 0, C: 0, D: 0 };

  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('resultCard').classList.remove('active');
  document.getElementById('allCharacters').classList.remove('active');

  renderQuestion(0);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ========== 启动 ==========
renderQuestion(0);
</script>
