<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎀 惊喜小游戏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;display:flex;justify-content:center;align-items:center;
  background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);
  font-family:'Segoe UI',sans-serif;padding:16px
}
.game-card{
  background:rgba(255,255,255,.08);backdrop-filter:blur(20px);border-radius:24px;
  padding:32px;max-width:520px;width:100%;box-shadow:0 25px 50px -12px rgba(0,0,0,.5);
  border:1px solid rgba(255,255,255,.1);text-align:center
}
h1{font-size:28px;color:#fff;margin-bottom:6px}
.sub{color:rgba(255,255,255,.5);font-size:14px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.card{
  aspect-ratio:1;border-radius:14px;font-size:32px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
  border:1px solid rgba(255,255,255,.08);transition:all .3s cubic-bezier(.4,0,.2,1);
  user-select:none;transform-style:preserve-3d
}
.card:hover:not(.matched):not(.disabled){background:rgba(255,255,255,.18);transform:scale(1.04)}
.card.flipped{background:rgba(255,255,255,.92);border-color:rgba(255,255,255,.3);transform:rotateY(0)}
.card.matched{background:rgba(72,187,120,.25);border-color:rgba(72,187,120,.3);cursor:default;animation:pulse .5s}
.card.matched .emoji{animation:pop .4s}
.card.disabled{cursor:default}
.emoji{transition:transform .3s}
.card:not(.flipped):not(.matched) .emoji{content:"";display:inline-block}
.card:not(.flipped):not(.matched){background:linear-gradient(145deg,rgba(99,102,241,.15),rgba(168,85,247,.1));border-color:rgba(99,102,241,.15)}
.card:not(.flipped):not(.matched) .emoji::before{content:""}
.stats{display:flex;justify-content:space-between;color:rgba(255,255,255,.7);font-size:14px;padding:0 4px;margin-bottom:16px}
.btn{
  background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;
  padding:12px 32px;border-radius:12px;font-size:16px;cursor:pointer;
  transition:all .3s;font-weight:600;letter-spacing:.3px
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px -8px rgba(99,102,241,.5)}
.btn:active{transform:scale(.96)}
.restart{background:rgba(255,255,255,.08);margin-left:8px}
.restart:hover{background:rgba(255,255,255,.15);box-shadow:none}
.msg{color:#fbbf24;font-size:15px;margin-bottom:14px;min-height:24px;font-weight:500}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .35s}
</style>
</head>
<body>
<div class="game-card" id="app">
  <h1>✨ 记忆翻牌</h1>
  <p class="sub">找出所有配对的情侣 emoji</p>
  <div class="msg" id="msg">点击任意牌开始游戏吧 🎯</div>
  <div class="stats">
    <span>❤️ 配对 <strong id="pairs">0</strong>/6</span>
    <span>👆 步数 <strong id="moves">0</strong></span>
  </div>
  <div class="grid" id="grid"></div>
  <div>
    <button class="btn" onclick="resetGame()">🔄 重新洗牌</button>
    <button class="btn restart" onclick="resetGame()">新的一局</button>
  </div>
</div>
<script>
const EMOJIS=['😊','😂','🥰','😍','🤩','😎','🥺','😏','🤗','😜','🤓','🥳'];
let cards=[],flipped=[],matched=0,moves=0,lock=false,timer=null;

function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.random()*i|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function init(){
  const pairs=EMOJIS.slice(0,6);
  cards=shuffle([...pairs,...pairs]);
  render();matched=0;moves=0;flipped=[];lock=false;
  document.getElementById('pairs').textContent='0';
  document.getElementById('moves').textContent='0';
  setMsg('点击任意牌开始游戏吧 🎯');
}

function render(){
  const grid=document.getElementById('grid');
  grid.innerHTML=cards.map((e,i)=>`
    <div class="card" data-i="${i}" onclick="flipCard(this,${i})">
      <span class="emoji">${e}</span>
    </div>
  `).join('');
}

function setMsg(t){document.getElementById('msg').textContent=t}

function flipCard(el,i){
  if(lock||el.classList.contains('flipped')||el.classList.contains('matched'))return;
  el.classList.add('flipped');
  flipped.push(i);moves++;
  document.getElementById('moves').textContent=moves;
  if(flipped.length===2)checkMatch();
}

function checkMatch(){
  lock=true;
  const [a,b]=flipped;
  if(cards[a]===cards[b]){
    document.querySelectorAll(`[data-i="${a}"],[data-i="${b}"]`).forEach(e=>{
      e.classList.remove('flipped');e.classList.add('matched');
    });
    matched++;flipped=[];
    document.getElementById('pairs').textContent=matched;
    setMsg(['💕 默契十足！','✨ 好厉害！','🌟 继续加油！','🎯 太棒了！','💝 快了快了！','🎉 再坚持一下！','⭐ 你可以的！','🌈 完美！'][Math.random()*8|0]);
    lock=false;
    if(matched===6){setMsg('🎊🎊🎊 恭喜通关！你太厉害啦！ 🎊🎊🎊');
      setTimeout(()=>confetti(),200);
    }
  }else{
    setMsg('😅 不对哦，再试试');
    setTimeout(()=>{
      document.querySelectorAll(`[data-i="${a}"],[data-i="${b}"]`).forEach(e=>{
        e.classList.remove('flipped');if(!e.classList.contains('matched'))e.classList.add('shake');
        setTimeout(()=>e.classList.remove('shake'),350);
      });
      flipped=[];lock=false;
      setMsg('🤔 记住位置哦～');
    },800);
  }
}

function confetti(){
  for(let i=0;i<50;i++){
    const el=document.createElement('div');
    el.style.cssText=`position:fixed;left:${Math.random()*100}vw;top:-10px;
      width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;
      background:hsl(${Math.random()*360},80%,60%);
      border-radius:${Math.random()>.5?'50%':'2px'};
      pointer-events:none;z-index:9999;
      animation:fall ${2+Math.random()*2}s linear forwards;
      animation-delay:${Math.random()*.5}s`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),4000);
  }
}

// inject fall animation
const s=document.createElement('style');
s.textContent=`@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}`;
document.head.appendChild(s);

function resetGame(){clearTimeout(timer);lock=false;init()}

init();
</script>
</body>
</html>
